name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交自动取消仍在跑的旧任务，节省免费额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (unit / no-DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      # 显式声明无数据库：需要真实 PG 的用例会被 tests/_ci_guard 整类跳过。
      DATABASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/portable/requirements-python.in

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 运行时依赖（含 fastapi / sqlalchemy / psycopg2-binary / playwright 等）
          python -m pip install -r requirements.txt
          # 仅测试期需要；不写入 requirements.txt，避免影响发行输入。
          python -m pip install pytest

      - name: Show environment
        run: |
          python --version
          python -m pytest --version

      - name: Run test suite
        run: |
          python -m pytest tests \
            --ignore=tests/portable_pg_smoke.py \
            --ignore=tests/portable_schema_pg_smoke.py \
            --ignore=tests/portable_setup_pg_smoke.py \
            --ignore=tests/portable_backup_pg_case.py \
            --ignore=tests/portable_config_pg_case.py \
            --ignore=tests/portable_session_pg_case.py \
            --ignore=tests/portable_web_pg_case.py \
            --ignore=tests/portable_setup_ui_smoke.py \
            --ignore=tests/test_portable_browser_runtime.py \
            --ignore=tests/test_portable_build_guards.py \
            --ignore=tests/test_portable_python_runtime.py \
            --ignore=tests/portable_settings_revision.test.cjs \
            --ignore=tests/upstream_notification_view.test.cjs \
            --ignore=tests/upstream_parameter_fallback.test.cjs \
            -q -p no:cacheprovider
